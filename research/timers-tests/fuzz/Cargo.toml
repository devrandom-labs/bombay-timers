[package]
name = "timers-tests-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace: the repository root workspace is production and
# immutable; the fuzz crate is built only with the nightly fuzzer toolchain.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
timers-tests = { path = ".." }

[[bin]]
name = "scheduler_ops"
path = "fuzz_targets/scheduler_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scheduler_ops_collide"
path = "fuzz_targets/scheduler_ops_collide.rs"
test = false
doc = false
bench = false
