[workspace]
resolver = "3"
members = ["crates/timepass", "crates/timepass-perf", "crates/timepass-harness"]
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
[workspace.dependencies]
timepass = { path = "crates/timepass" }
criterion = "0.8"
loom = "0.7"
rustc-hash = "2"
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

